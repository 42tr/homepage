name: Build and publish homepage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      ALIYUN_REGISTRY: crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com
      SITE_URL: ${{ vars.SITE_URL || 'https://42tr.cn' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - name: Check Rust backend
        run: |
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo test --manifest-path backend/Cargo.toml
      - name: Upload embedded static site
        uses: actions/upload-artifact@v6
        with:
          name: homepage-static
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
      - name: Build image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homepage:verify
          cache-from: type=gha
      - name: Check Axum HTTP behavior
        run: |
          docker volume create homepage-ci-data
          docker run -d --name homepage-ci --publish 8080:8080 \
            --volume homepage-ci-data:/data homepage:verify
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health >/dev/null
          node scripts/verify-http.mjs http://127.0.0.1:8080
          node scripts/verify-views.mjs http://127.0.0.1:8080
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser interactions and print layout
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npx playwright test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Rust image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/42tr/homepage:latest
            ghcr.io/42tr/homepage:${{ github.ref_name }}
            ghcr.io/42tr/homepage:sha-${{ github.sha }}
            ghcr.io/42tr/homepage:run-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install registry copy tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Log in to Alibaba Cloud registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Sync and verify Alibaba Cloud image
        timeout-minutes: 40
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          source_image="docker://ghcr.io/42tr/homepage@${IMAGE_DIGEST}"
          for tag in "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "sha-${GITHUB_SHA}" "${GITHUB_REF_NAME}" latest; do
            destination_image="docker://${ALIYUN_REGISTRY}/42tr/homepage:${tag}"
            echo "Syncing ${destination_image}"
            skopeo --command-timeout 35m copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" \
              "$source_image" "$destination_image"
            actual_digest="sha256:$(skopeo inspect --authfile "$HOME/.docker/config.json" \
              --raw "$destination_image" | sha256sum | cut -d ' ' -f 1)"
            test "$actual_digest" = "$IMAGE_DIGEST"
            echo "Verified ${tag}: ${actual_digest}"
          done
      - name: Stop smoke-test container
        if: always()
        run: |
          docker rm --force homepage-ci || true
          docker volume rm homepage-ci-data || true
