name: Build and publish homepage

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    env:
      ALIYUN_REGISTRY: crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com
      SITE_URL: ${{ vars.SITE_URL || 'https://42tr.cn' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify blog counters and the LeetCode backend
        run: python3 -m unittest discover -s services/views -p 'test_*.py'
      - run: npm run build
      - run: npm run verify
      - name: Upload static site
        uses: actions/upload-artifact@v6
        with:
          name: homepage-static
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
      - name: Build image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homepage:verify
          cache-from: type=gha
      - name: Check Nginx and HTTP behavior
        env:
          HOMEPAGE_IMAGE: homepage:verify
          HOMEPAGE_PORT: '8080'
          COMPOSE_PROJECT_NAME: homepage-ci
        run: |
          docker run --rm homepage:verify nginx -t
          docker compose up -d --wait --wait-timeout 90
          node scripts/verify-http.mjs
          node scripts/verify-views.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser interactions and print layout
        run: npx playwright test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Nginx image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Alibaba Cloud Personal Edition rejects OCI empty-config attestations.
          provenance: false
          tags: |
            ghcr.io/42tr/homepage:latest
            ghcr.io/42tr/homepage:sha-${{ github.sha }}
            ghcr.io/42tr/homepage:run-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install registry copy tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Log in to Alibaba Cloud registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Sync and verify Alibaba Cloud image
        timeout-minutes: 40
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          source_image="docker://ghcr.io/42tr/homepage@${IMAGE_DIGEST}"
          for tag in "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "sha-${GITHUB_SHA}" latest; do
            destination_image="docker://${ALIYUN_REGISTRY}/42tr/homepage:${tag}"
            echo "Syncing ${destination_image}"
            skopeo --command-timeout 35m copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" \
              "$source_image" "$destination_image"
            actual_digest="sha256:$(skopeo inspect --authfile "$HOME/.docker/config.json" \
              --raw "$destination_image" | sha256sum | cut -d ' ' -f 1)"
            test "$actual_digest" = "$IMAGE_DIGEST"
            echo "Verified ${tag}: ${actual_digest}"
          done
      - name: Stop test container
        if: always()
        env:
          HOMEPAGE_IMAGE: homepage:verify
          HOMEPAGE_PORT: '8080'
          COMPOSE_PROJECT_NAME: homepage-ci
        run: |
          docker compose down --volumes || true
