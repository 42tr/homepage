name: Build and publish homepage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # UTC, once an hour; avoid the busy top of the hour.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://42tr.cn' }}
      LEETCODE_USER_SLUG: ${{ vars.LEETCODE_USER_SLUG || 'U72xhfFR3l' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Restore last successful LeetCode snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: data/leetcode.json
          key: leetcode-${{ env.LEETCODE_USER_SLUG }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: leetcode-${{ env.LEETCODE_USER_SLUG }}-
      - name: Refresh LeetCode
        if: github.event_name != 'pull_request'
        run: npm run update:leetcode
      - name: Save LeetCode snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: data/leetcode.json
          key: leetcode-${{ env.LEETCODE_USER_SLUG }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - run: npm run verify
      - name: Upload static site
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v6
        with:
          name: homepage-static
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
      - name: Build image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homepage:verify
          cache-from: type=gha
      - name: Check Nginx and HTTP behavior
        run: |
          docker run --rm homepage:verify nginx -t
          docker run -d --name homepage-ci -p 127.0.0.1:8080:80 homepage:verify
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          node scripts/verify-http.mjs
      - name: Install browser
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium
      - name: Verify browser interactions and print layout
        if: github.event_name != 'schedule'
        run: npx playwright test
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/42tr/homepage:latest
            ghcr.io/42tr/homepage:sha-${{ github.sha }}
            ghcr.io/42tr/homepage:run-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Stop test container
        if: always()
        run: docker rm -f homepage-ci || true
