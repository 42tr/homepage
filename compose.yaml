services:
  homepage:
    build: .
    image: ${HOMEPAGE_IMAGE:-ghcr.io/42tr/homepage:latest}
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3000}:8080"
    environment:
      LEETCODE_USER_SLUG: ${LEETCODE_USER_SLUG:-U72xhfFR3l}
      LEETCODE_REFRESH_SECONDS: ${LEETCODE_REFRESH_SECONDS:-600}
    volumes:
      - "${HOMEPAGE_DATA_DIR:-blog-views}:/data"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  blog-views:
