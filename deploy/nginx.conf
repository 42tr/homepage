server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;
    set $blog_views_upstream "${BLOG_VIEWS_UPSTREAM}";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Live snapshot from the backend; the build-time JSON covers a restart.
    location = /api/leetcode {
        proxy_pass http://$blog_views_upstream;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @leetcode_seed;
    }

    location @leetcode_seed {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files /api/leetcode.json =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/blog/views {
        proxy_pass http://$blog_views_upstream;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

    location ~ ^/blog/posts/[A-Za-z0-9_-]+/?$ {
        mirror /_blog_view;
        mirror_request_body off;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    location = /_blog_view {
        internal;
        proxy_pass http://$blog_views_upstream/record;
        proxy_method POST;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
